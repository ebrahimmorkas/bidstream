{% extends "base.html" %}

{% block title %}Sign up{% endblock %}

{% block content %}
<div class="page-header"><h1>Create your account</h1></div>
<div class="card">
  <form method="post" class="form" novalidate>
    {% csrf_token %}
    {{ form.as_div }}
    <div><button class="btn" type="submit">Sign up</button></div>
    <p class="muted">Already registered? <a href="{% url 'login' %}">Log in</a></p>
  </form>
</div>
{% endblock %}
