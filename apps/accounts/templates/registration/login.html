{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<div class="page-header"><h1>Log in</h1></div>
<div class="card">
  <form method="post" class="form" novalidate>
    {% csrf_token %}
    {{ form.as_div }}
    <input type="hidden" name="next" value="{{ next }}">
    <div><button class="btn" type="submit">Log in</button></div>
    <p class="muted">New here? <a href="{% url 'signup' %}">Create an account</a></p>
  </form>
</div>
{% endblock %}
